# Same settings as the other seven servers wherever all have one: address, port, database, a pool of 32, no access
# log. Everything else is the Spring Boot default (200 Tomcat threads, JVM ergonomics for the cores it is pinned to).
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=bench
spring.datasource.hikari.maximum-pool-size=32
spring.jackson.property-naming-strategy=SNAKE_CASE
logging.level.root=WARN
logging.level.bench=INFO
